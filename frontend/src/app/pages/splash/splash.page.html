<ion-content class="ms-splash-content" [fullscreen]="true">
  <div class="ms-splash">
    <div class="ms-splash-icon" [class.ms-splash-icon--arriba]="stage === 1">
      <svg viewBox="0 0 64 64" class="ms-splash-icon-svg" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M8 4H56V56L51.2 61L46.4 56L41.6 61L36.8 56L32 61L27.2 56L22.4 61L17.6 56L12.8 61L8 56Z"
          fill="var(--ms-papel-hoja)"
        />
        <rect x="15" y="13" width="30" height="9" rx="2" fill="var(--ms-marcador)" transform="rotate(-4 30 17)" />
        <rect x="16" y="30" width="32" height="3.5" rx="1.75" fill="var(--ms-tinta-azul)" />
        <rect x="16" y="39" width="17" height="3.5" rx="1.75" fill="var(--ms-tinta-azul)" />
        <path
          d="M36 41l5 5 10-12"
          fill="none"
          stroke="var(--ms-marcador)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <span class="ms-logo-text ms-logo-text--brand ms-splash-wordmark" [class.ms-splash-wordmark--visible]="stage === 1">
      <span class="ms-logo-menu ms-logo-menu--brand">menu</span><span class="ms-logo-accent">smart</span>
    </span>

    <p class="ms-splash-tagline" [class.ms-splash-tagline--visible]="stage === 1">planifica · anota · ahorra</p>

    <p class="ms-splash-version">prototipo v1.0</p>
  </div>
</ion-content>
