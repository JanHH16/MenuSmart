<nav class="ms-sidebar">
  <div class="ms-sidebar-logo">
    <!-- Figma: logoMark(onDark) 42px + wordmark(36px, onDark): "menu" en
         papel y "smart" en marcador amarillo. -->
    <svg viewBox="0 0 64 64" class="ms-sidebar-logo-svg" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M8 4H56V56L51.2 61L46.4 56L41.6 61L36.8 56L32 61L27.2 56L22.4 61L17.6 56L12.8 61L8 56Z"
        fill="var(--ms-papel-hoja)"
      />
      <rect x="15" y="13" width="30" height="9" rx="2" fill="var(--ms-marcador)" transform="rotate(-4 30 17)" />
      <rect x="16" y="30" width="32" height="3.5" rx="1.75" fill="var(--ms-tinta-azul)" />
      <rect x="16" y="39" width="17" height="3.5" rx="1.75" fill="var(--ms-tinta-azul)" />
      <path
        d="M36 41l5 5 10-12"
        fill="none"
        stroke="var(--ms-marcador)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="ms-logo-text ms-logo-text--brand ms-sidebar-wordmark">
      <span class="ms-logo-menu ms-logo-menu--brand">menu</span><span class="ms-logo-accent">smart</span>
    </span>
  </div>

  <ul class="ms-sidebar-menu">
    @for (item of items; track item.href) {
      <li>
        <!-- exact: en subpantallas (ej. Detalle de comida) Figma no resalta
             ningún ítem del menú — sidebar(f, -1). -->
        <a
          [routerLink]="item.href"
          routerLinkActive="ms-sidebar-item--activo"
          [routerLinkActiveOptions]="{ exact: true }"
          class="ms-sidebar-item"
        >
          <!-- Íconos de trazo del prototipo (Figma: ICONS plan/list/receipt/user). -->
          <svg
            class="ms-sidebar-item-icono"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            @switch (item.icono) {
              @case ('plan') {
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M3 10h18M8 3v4M16 3v4" />
              }
              @case ('list') {
                <path d="M10 6h10M10 12h10M10 18h10" />
                <path d="M3.5 6l1.5 1.5 2.5-3M3.5 12l1.5 1.5 2.5-3M3.5 18l1.5 1.5 2.5-3" />
              }
              @case ('receipt') {
                <path d="M5 3h14v18l-2.3-1.5-2.4 1.5-2.3-1.5-2.3 1.5-2.4-1.5L5 21z" />
                <path d="M9 8h6M9 12h6M9 16h3" />
              }
              @case ('user') {
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" />
              }
            }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <p class="ms-sidebar-tagline">planifica · anota · ahorra</p>

  <div class="ms-sidebar-user">
    <span class="ms-sidebar-avatar">UD</span>
    <span class="ms-sidebar-user-name">Usuario Demo</span>
  </div>
</nav>
