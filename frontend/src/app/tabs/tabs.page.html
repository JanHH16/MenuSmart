@if (esDesktop$ | async; as esDesktop) {
  <!-- Desktop (Figma "D*"): sidebar fija a la izquierda en vez de tab-bar
       inferior. Es OTRA estructura (ion-tabs sin ion-tab-bar, con
       app-sidebar como hermano), no el mismo tab-bar reacomodado. -->
  <div class="ms-shell ms-shell--desktop">
    <app-sidebar></app-sidebar>
    <ion-tabs class="ms-tabs-outlet"></ion-tabs>
  </div>
} @else {
  <div class="ms-shell">
    <ion-tabs class="ms-tabs-outlet">
      <!-- Figma: tabBar() — íconos de trazo del prototipo (ICONS plan/list/
           receipt/user) y marcador amarillo detrás de la etiqueta activa. -->
      <ion-tab-bar slot="bottom" class="ms-tab-bar">
        <ion-tab-button tab="plan-semanal" href="/tabs/plan-semanal">
          <svg class="ms-tab-icono" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" />
          </svg>
          <ion-label>Plan</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="lista-compras" href="/tabs/lista-compras">
          <svg class="ms-tab-icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 6h10M10 12h10M10 18h10" />
            <path d="M3.5 6l1.5 1.5 2.5-3M3.5 12l1.5 1.5 2.5-3M3.5 18l1.5 1.5 2.5-3" />
          </svg>
          <ion-label>Lista</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="comparador" href="/tabs/comparador">
          <svg class="ms-tab-icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 3h14v18l-2.3-1.5-2.4 1.5-2.3-1.5-2.3 1.5-2.4-1.5L5 21z" />
            <path d="M9 8h6M9 12h6M9 16h3" />
          </svg>
          <ion-label>Comparar</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="perfil" href="/tabs/perfil">
          <svg class="ms-tab-icono" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" />
          </svg>
          <ion-label>Perfil</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </div>
}
